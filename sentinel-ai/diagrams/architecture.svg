  <text x="850" y="234" text-anchor="middle" fill="#7dd3fc" font-size="9">Immutable Event Trail</text>

  <!-- Connector 2 -->
  <line x1="500" y1="260" x2="500" y2="285" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-active)" />

