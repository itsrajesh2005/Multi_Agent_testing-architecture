  <line x1="500" y1="520" x2="500" y2="550" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)" />

  <!-- LAYER 4: STORAGE & DELIVERABLES -->
  <rect x="50" y="550" width="900" height="90" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
