    <text x="12" y="74" fill="#94a3b8" font-size="9">• Telemetry Check</text>
    <text x="12" y="90" fill="#94a3b8" font-size="9">• Deduplication</text>
    <text x="12" y="106" fill="#94a3b8" font-size="9">• Status: Verified</text>
