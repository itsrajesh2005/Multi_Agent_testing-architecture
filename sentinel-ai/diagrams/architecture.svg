    <text x="36" y="25" fill="#f8fafc" font-size="10.5" font-weight="700">Risk Assessment</text>
    <line x1="8" y1="40" x2="127" y2="40" stroke="#334155" />
    <text x="12" y="58" fill="#94a3b8" font-size="9">• CVSS Scoring</text>
    <text x="12" y="74" fill="#94a3b8" font-size="9">• Exposure Analysis</text>
    <text x="12" y="90" fill="#94a3b8" font-size="9">• Business Impact</text>
    <text x="12" y="106" fill="#94a3b8" font-size="9">• Remediation P0-P4</text>
