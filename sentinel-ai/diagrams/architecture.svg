  <text x="330" y="608" text-anchor="middle" fill="#6ee7b7" font-size="9.5">SQLite / PostgreSQL Schema</text>

  <rect x="450" y="565" width="200" height="60" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="550" y="590" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">Validated JSON Report</text>
  <text x="550" y="608" text-anchor="middle" fill="#6ee7b7" font-size="9.5">Pydantic ReportSchema</text>

  <rect x="670" y="565" width="250" height="60" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="795" y="590" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">Sanitized HTML Report</text>
  <text x="795" y="608" text-anchor="middle" fill="#6ee7b7" font-size="9.5">Executive View + Escaped Entities</text>

</svg>
