    <rect width="135" height="165" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="20" cy="22" r="10" fill="#4338ca" />
    <text x="20" y="26" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">3</text>
    <text x="36" y="25" fill="#f8fafc" font-size="10.5" font-weight="700">Vuln Analysis</text>
