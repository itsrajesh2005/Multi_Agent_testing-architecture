    <text x="34" y="25" fill="#6ee7b7" font-size="10" font-weight="700">Report Gen</text>
    <line x1="6" y1="40" x2="99" y2="40" stroke="#334155" />
    <text x="8" y="58" fill="#94a3b8" font-size="8.5">• Exec Summary</text>
    <text x="8" y="74" fill="#94a3b8" font-size="8.5">• Methodology</text>
    <text x="8" y="90" fill="#94a3b8" font-size="8.5">• HTML Builder</text>
