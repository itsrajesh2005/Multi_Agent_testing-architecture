  <!-- Title Header -->
  <text x="500" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">SentinelAI Multi-Agent Penetration Testing Architecture</text>
  <text x="500" y="65" text-anchor="middle" fill="#94a3b8" font-size="12">Deterministic Security Controls + LangGraph Multi-Agent Orchestration + Google Gemini LLM</text>

  <!-- LAYER 1: CLIENT & DASHBOARD -->
  <rect x="50" y="90" width="900" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="125" fill="#f8fafc" font-size="14" font-weight="600">Client &amp; Analyst Layer</text>
  <rect x="230" y="105" width="220" height="40" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
  <text x="340" y="130" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">Interactive Security Dashboard</text>
  <rect x="470" y="105" width="220" height="40" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
  <text x="580" y="130" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">FastAPI REST Client / SDK</text>
  <rect x="710" y="105" width="215" height="40" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
  <text x="817" y="130" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">Human Approval Gate (HitL)</text>

  <!-- Connector 1 -->
  <line x1="500" y1="160" x2="500" y2="185" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-active)" />

  <!-- LAYER 2: SECURITY GATEWAY -->
  <rect x="50" y="185" width="900" height="75" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5" />
  <text x="70" y="222" fill="#38bdf8" font-size="14" font-weight="600">Security Gateway</text>
  <rect x="220" y="200" width="165" height="44" rx="6" fill="#082f49" stroke="#0ea5e9" stroke-width="1" />
  <text x="302" y="220" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="600">JWT Auth &amp; RBAC</text>
  <text x="302" y="234" text-anchor="middle" fill="#7dd3fc" font-size="9">Admin / Analyst / Viewer</text>

  <rect x="400" y="200" width="180" height="44" rx="6" fill="#082f49" stroke="#0ea5e9" stroke-width="1" />
  <text x="490" y="220" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="600">Scope Validator (SSRF)</text>
  <text x="490" y="234" text-anchor="middle" fill="#7dd3fc" font-size="9">Strict CIDR/DNS Lab Allowlist</text>

  <rect x="595" y="200" width="165" height="44" rx="6" fill="#082f49" stroke="#0ea5e9" stroke-width="1" />
  <text x="677" y="220" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="600">Approval Guard</text>
